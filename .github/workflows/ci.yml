# Push/PR gate — build + smoke tests before release dispatch lands.
#
# Public repo: always GitHub-hosted (ubuntu-latest). Do NOT set CI_RUNNER —
# org policy forbids self-hosted listeners on public repos (fork-PR RCE risk).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm test
